<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <main>
        <table border="1" cellspacing="0" cellpadding="10">
            <thead>
                <tr>
                    <th>Country</th>
                    <th>City</th>
                    <th>Why Visit?</th>
                    <th>Photo</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Japan</td>
                    <td>Kyoto</td>
                    <td>Beautiful temples and cherry blossoms</td>
                    <td><img width="400px" src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/2b/e6/6d/87/caption.jpg?w=1200&h=700&s=1&cx=2550&cy=1700&chk=v1_07f8c3fadbb1e4b056fe" alt="Kyoto Temple"></td>
                </tr>
                <tr>
                    <td>France</td>
                    <td>Paris</td>
                    <td>Romantic vibe and Eiffel Tower</td>
                    <td><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Tour_Eiffel_Wikimedia_Commons_%28cropped%29.jpg/330px-Tour_Eiffel_Wikimedia_Commons_%28cropped%29.jpg" alt="Eiffel Tower"></td>
                </tr>
                <tr>
                    <td>Egypt</td>
                    <td>Cairo</td>
                    <td>Great Pyramids and ancient history</td>
                    <td><img width="400px" src="https://www.worldtouradvice.com/files/large/1557ea79e1a820aad949c06bb6751ce9.jpg" alt="Pyramids"></td>
                </tr>
                <tr>
                    <td>Italy</td>
                    <td>Venice</td>
                    <td>Romantic canals and gondolas</td>
                    <td><img src="invalid-path.jpg" alt="Venice Canal"></td>
                </tr>
                <tr>
                    <td>USA</td>
                    <td>New York</td>
                    <td>Skyscrapers and Broadway shows</td>
                    <td><img src="invalid-path.jpg" alt="New York Skyline"></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
