<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="title"> Animated Countdown Timer</div> 
        <div class="actions"> 
            <input class="txt-feild" type="text" placeholder="Write a number" name="countdown">
            <button id="start-countdown">Start Countdown</button>
        </div>
        <p class="count"></p>
        <div class="history"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
